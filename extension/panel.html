<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sleeper Rankings</title>
<style>
  html,body{margin:0;height:100%;background:#fff;
    font:14px/1.4 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
  @media(prefers-color-scheme:dark){html,body{background:#16161a;color:#ececf0}}
  #setup{padding:16px;display:none}
  #setup p{margin:0 0 10px}
  #setup input{width:100%;padding:8px;box-sizing:border-box;margin-bottom:8px;
    font:inherit;border-radius:6px;border:1px solid #ccc}
  #setup button{padding:8px 14px;font:inherit;font-weight:600;border-radius:6px;
    border:0;background:#b45309;color:#fff;cursor:pointer}
  iframe{border:0;width:100%;height:100%;display:none}
</style>
</head>
<body>
  <div id="setup">
    <p>Enter your Sleeper username to show your rankings here.</p>
    <input id="user" placeholder="Sleeper username" autocomplete="off" spellcheck="false">
    <button id="go" type="button">Continue</button>
  </div>
  <iframe id="frame" title="Sleeper Rankings"></iframe>
  <script src="panel.js"></script>
</body>
</html>
