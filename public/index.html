<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Weekly Sleeper Rankings</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1>Weekly Sleeper Rankings</h1>
    <p class="sub">
      <span id="week">Loading…</span> ·
      Sleeper projections, scored by each league's own settings.
    </p>
  </header>

  <form id="form" autocomplete="off">
    <input id="username" name="username" type="text" placeholder="Sleeper username"
           spellcheck="false" autocapitalize="none" aria-label="Sleeper username">
    <button type="submit">View weekly rankings</button>
  </form>

  <div id="picker" hidden>
    <label for="league">League</label>
    <select id="league"></select>
  </div>

  <p id="stale" class="stale" hidden></p>
  <p id="status" class="status" hidden></p>
  <main id="results"></main>

  <footer>
    Ranks are positional (QB1, WR8, DST3), computed from projected points under
    your league's exact scoring. <span id="gen"></span><br>
    All data from the <a href="https://docs.sleeper.com/">Sleeper API</a>.
  </footer>
</div>
<script src="app.js"></script>
</body>
</html>
