name: Build rankings

on:
  schedule:
    # Daily at 13:00 UTC ≈ 9am ET, plus Sunday mornings when ranks actually move.
    - cron: "0 13 * * *"
    - cron: "0 12,14,15,16,17 * * 0"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -r requirements.txt

      - name: Tests
        run: |
          node test_app.js
          python3 test_build.py
          python3 test_norm_parity.py

      # Reports whether the key works and what the API returns. Never fails
      # the build - read it in the log when something looks wrong.
      - name: Probe data sources
        continue-on-error: true
        env:
          FANTASYPROS_API_KEY: ${{ secrets.FANTASYPROS_API_KEY }}
        run: python probe.py

      - name: Fetch consensus rankings and assemble site
        env:
          FANTASYPROS_API_KEY: ${{ secrets.FANTASYPROS_API_KEY }}
        run: python build.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
