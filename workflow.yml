name: Build rankings

on:
  schedule:
    # Baseline: every morning at 13:00 UTC ≈ 9am ET.
    - cron: "0 13 * * *"
    # Sunday 12:00-17:00 UTC ≈ 8am-1pm ET, hourly, while inactives drop and
    # ranks actually move. The 13:00 slot is covered by the daily run above.
    - cron: "0 12,14,15,16,17 * * 0"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -r requirements.txt

      # Sleeper asks for at most one pull of the ~5MB player dump per day, so
      # it is cached per calendar day. Rankings are always fetched fresh.
      - id: day
        run: echo "key=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: .cache
          key: sleeper-players-${{ steps.day.outputs.key }}

      - name: Tests
        run: |
          python3 test_build.py
          node test_app.js

      - name: Fetch rankings and build site
        run: python build.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
