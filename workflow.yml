name: Build rankings

on:
  schedule:
    # 13:00 UTC ≈ 9am ET — Tue (post-MNF), Thu (pre-TNF), Sat, Sun (pre-kickoff)
    - cron: "0 13 * * 2,4,6,0"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -r requirements.txt

      - name: Tests
        run: |
          python3 test_build.py
          node test_app.js

      - name: Fetch rankings and build site
        run: python build.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
